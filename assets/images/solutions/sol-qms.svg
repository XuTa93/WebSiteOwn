<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="qms-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="qms-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0FAFC" />
      <stop offset="100%" stop-color="#E6F4F6" />
    </linearGradient>
    <linearGradient id="qms-shield-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CC0D1" />
      <stop offset="100%" stop-color="#026A74" />
    </linearGradient>
    <linearGradient id="qms-shield-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0699A8" />
      <stop offset="100%" stop-color="#01535B" />
    </linearGradient>
    <linearGradient id="qms-shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="qms-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="qms-shield-clip">
      <path d="M 48,25 L 70,34 L 70,52 C 70,66 60,76 48,81 C 36,76 26,66 26,52 L 26,34 Z" />
    </clipPath>
    <style>
      .qms-shine { animation: qms-sweep 3.4s ease-in-out infinite; }
      .qms-check-ring { animation: qms-ring 3.4s ease-out infinite; }
      .qms-spc-dot { animation: qms-beacon 3.4s ease-in-out infinite; }
      @keyframes qms-sweep {
        0%, 20% { transform: translateX(-46px); }
        65%, 100% { transform: translateX(58px); }
      }
      @keyframes qms-ring {
        0%, 35% { transform: scale(0.8); opacity: 0; }
        55% { transform: scale(1.05); opacity: 0.7; }
        100% { transform: scale(1.38); opacity: 0; }
      }
      @keyframes qms-beacon {
        0%, 100% { transform: translate(0px, 0px); }
        33% { transform: translate(9px, -6px); }
        66% { transform: translate(18px, 3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#qms-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="qms-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#qms-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CCE9ED" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#026A74" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#01535B" />
  </g>

  <!-- Background/Right Elevated SPC Control Chart Card -->
  <g id="qms-spc-card">
    <!-- Stand Support -->
    <polygon points="78,61 81,61 81,78 78,78" fill="#525C58" />
    <!-- Card Shadow & Surface -->
    <rect x="57" y="21" width="44" height="42" rx="3" fill="#262626" opacity="0.12" transform="translate(2, 2)" />
    <rect x="57" y="21" width="44" height="42" rx="3" fill="#FFFFFF" stroke="#CBD4D0" stroke-width="1" />
    <!-- Top Dark Accent Header -->
    <path d="M 57 24 C 57 22.3 58.3 21 60 21 L 98 21 C 99.7 21 101 22.3 101 24 L 101 27 L 57 27 Z" fill="#262626" />
    <circle cx="95.5" cy="24" r="1.4" fill="#4CE3F2" />
    <!-- UCL / LCL Control Limit Dashed Lines -->
    <line x1="62" y1="33" x2="96" y2="33" stroke="#F5A524" stroke-width="1" stroke-dasharray="2.5 2" />
    <line x1="62" y1="44" x2="96" y2="44" stroke="#CCE9ED" stroke-width="1" />
    <line x1="62" y1="55" x2="96" y2="55" stroke="#F5A524" stroke-width="1" stroke-dasharray="2.5 2" />
    <!-- SPC Process Curve -->
    <polyline points="62,48 68,42 74,47 83,41 92,50 96,43" stroke="#026A74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="83" cy="41" r="1.5" fill="#026A74" />
    <circle cx="92" cy="50" r="1.5" fill="#026A74" />
    <!-- Live Moving SPC Measurement Beacon -->
    <g transform="translate(74, 47)">
      <circle class="qms-spc-dot" cx="0" cy="0" r="2.6" fill="#1CC0D1" stroke="#FFFFFF" stroke-width="0.9" filter="url(#qms-glow)" />
    </g>
  </g>

  <!-- Hero 2.5D Industrial QC Verification Shield -->
  <g id="qms-shield">
    <!-- Pedestal Anchor -->
    <polygon points="44,82 52,82 52,89 44,89" fill="#3D3D3D" />
    <!-- Dark Steel 3D Extruded Back Shell -->
    <path d="M 51,21 L 76,31.5 L 76,54 C 76,71 64,83 51,88.5 C 38,83 26,71 26,54 L 26,31.5 Z" fill="#262626" />
    <!-- Brushed Steel Front Bezel -->
    <path d="M 48,20 L 73,30.5 L 73,53 C 73,70 61,82 48,87.5 C 35,82 23,70 23,53 L 23,30.5 Z" fill="#E4EAE7" />
    <!-- Sculpted 2.5D Emerald Facets -->
    <path d="M 48,25 L 70,34 L 70,52 C 70,66 60,76 48,81 C 36,76 26,66 26,52 L 26,34 Z" fill="url(#qms-shield-left)" />
    <path d="M 48,25 L 70,34 L 70,52 C 70,66 60,76 48,81 Z" fill="url(#qms-shield-right)" />
    <!-- Crisp Top Specular Edge -->
    <polyline points="26,34 48,25 70,34" stroke="#4CE3F2" stroke-width="1.2" stroke-linecap="round" />

    <!-- Animated Specular Sweep Clipped Inside Shield -->
    <g clip-path="url(#qms-shield-clip)">
      <g class="qms-shine">
        <polygon points="32,20 46,20 34,86 20,86" fill="url(#qms-shine-grad)" />
      </g>
    </g>

    <!-- Expanding Verification Halo Ring -->
    <g transform="translate(48, 52)">
      <circle class="qms-check-ring" cx="0" cy="0" r="14" stroke="#4CE3F2" stroke-width="1.5" />
    </g>

    <!-- Bold Crisp White Verification Checkmark -->
    <polyline points="38.5,52.5 45.5,59.5 59,44" stroke="#074E5A" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" transform="translate(0.8, 1.4)" />
    <polyline points="38.5,52.5 45.5,59.5 59,44" stroke="#FFFFFF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
