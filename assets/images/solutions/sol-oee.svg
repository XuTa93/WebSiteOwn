<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="oee-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="oee-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F2FAF5" />
      <stop offset="100%" stop-color="#E6F4EC" />
    </linearGradient>
    <linearGradient id="oee-bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="100%" stop-color="#262626" />
    </linearGradient>
    <linearGradient id="oee-green-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008B45" />
      <stop offset="55%" stop-color="#38B870" />
      <stop offset="100%" stop-color="#5EE49B" />
    </linearGradient>
    <filter id="oee-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .oee-needle { animation: oee-sweep 3.8s ease-in-out infinite; }
      .oee-radar { animation: oee-pulse 2.2s ease-out infinite; }
      .oee-arc-glow { animation: oee-shimmer 2.8s ease-in-out infinite; }
      .oee-apq-1 { animation: oee-bar 3.2s ease-in-out infinite; }
      .oee-apq-2 { animation: oee-bar 3.2s ease-in-out -1.0s infinite; }
      .oee-apq-3 { animation: oee-bar 3.2s ease-in-out -2.0s infinite; }
      @keyframes oee-sweep {
        0%, 100% { transform: rotate(42deg); }
        45% { transform: rotate(78deg); }
        70% { transform: rotate(62deg); }
      }
      @keyframes oee-pulse {
        0% { transform: scale(0.75); opacity: 0.85; }
        100% { transform: scale(1.95); opacity: 0; }
      }
      @keyframes oee-shimmer {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; }
      }
      @keyframes oee-bar {
        0%, 100% { transform: scaleX(0.84); }
        50% { transform: scaleX(1.04); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#oee-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="oee-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#oee-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CFEAD9" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#008B45" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#128243" />
  </g>

  <!-- Gauge Stand Pedestal -->
  <polygon points="44,83 51,86.5 58,83 58,87.5 51,91 44,87.5" fill="#3D3D3D" />
  <polygon points="47,76 55,76 55,85 47,85" fill="#262626" />

  <!-- 2.5D Industrial OEE Tachometer Gauge (cx=51, cy=54) -->
  <g id="oee-gauge">
    <!-- Extruded Back Cylindrical Rim for 2.5D Depth -->
    <circle cx="53.5" cy="56.5" r="29" fill="#3D3D3D" />
    <circle cx="51" cy="54" r="29" fill="url(#oee-bezel)" />
    <!-- Metallic Inner Ring & White Dial Face -->
    <circle cx="51" cy="54" r="25.5" fill="#E4EAE7" />
    <circle cx="51" cy="54" r="23.8" fill="#FFFFFF" />

    <!-- Segmented OEE Gauge Arcs (Shifted -2 in Y to match cy=54) -->
    <g transform="translate(0, -2)">
      <!-- Background Track -->
      <path d="M 34.21 67.76 A 20.5 20.5 0 1 1 67.79 67.76" stroke="#E4EAE7" stroke-width="4.2" stroke-linecap="round" />
      <!-- Low (Red) Zone -->
      <path d="M 34.21 67.76 A 20.5 20.5 0 0 1 31.03 51.39" stroke="#D92D20" stroke-width="3.6" stroke-linecap="round" />
      <!-- Warning (Amber) Zone -->
      <path d="M 31.40 50.01 A 20.5 20.5 0 0 1 45.01 36.40" stroke="#F5A524" stroke-width="3.6" stroke-linecap="round" />
      <!-- Optimal OEE (Emerald) Zone -->
      <path class="oee-arc-glow" d="M 46.39 36.03 A 20.5 20.5 0 0 1 67.79 67.76" stroke="url(#oee-green-arc)" stroke-width="4.4" stroke-linecap="round" />

      <!-- Precision Dial Ticks -->
      <g stroke="#76827D" stroke-width="1.1" stroke-linecap="round">
        <line x1="37.07" y1="65.75" x2="35.27" y2="67.01" />
        <line x1="34.58" y1="51.60" x2="32.45" y2="51.03" />
        <line x1="43.82" y1="40.59" x2="42.89" y2="38.60" />
        <line x1="51.00" y1="39.00" x2="51.00" y2="36.80" />
        <line x1="58.18" y1="40.59" x2="59.11" y2="38.60" />
        <line x1="64.02" y1="45.07" x2="65.71" y2="43.66" />
        <line x1="67.42" y1="51.60" x2="69.55" y2="51.03" />
        <line x1="64.93" y1="65.75" x2="66.73" y2="67.01" />
      </g>
    </g>

    <!-- 3 Compact A / P / Q Metric Mini-Bars Inside Lower Dial -->
    <g transform="translate(40.5, 65.5)">
      <rect x="0" y="0" width="21" height="2" rx="1" fill="#E4EAE7" />
      <rect class="oee-apq-1" x="0" y="0" width="18" height="2" rx="1" fill="#008B45" />
      <rect x="0" y="3.5" width="21" height="2" rx="1" fill="#E4EAE7" />
      <rect class="oee-apq-2" x="0" y="3.5" width="16" height="2" rx="1" fill="#38B870" />
      <rect x="0" y="7" width="21" height="2" rx="1" fill="#E4EAE7" />
      <rect class="oee-apq-3" x="0" y="7" width="19.5" height="2" rx="1" fill="#2E8B57" />
    </g>

    <!-- Animated Precision Needle Centered at (51, 54) -->
    <g transform="translate(51, 54)">
      <g class="oee-needle">
        <polygon points="-1.8,4 0,-18.5 1.8,4" fill="#262626" />
        <polygon points="0,-18.5 1.8,4 0,4" fill="#008B45" />
      </g>
      <circle cx="0" cy="0" r="4.2" fill="#262626" />
      <circle cx="0" cy="0" r="2.1" fill="#38B870" />
    </g>
  </g>

  <!-- 3-Tier Industrial Andon Signal Tower on Right -->
  <g id="oee-andon">
    <!-- Base Collar on Plinth -->
    <polygon points="84,79 89,76.5 94,79 89,81.5" fill="#525C58" />
    <polygon points="84,79 89,81.5 89,84 84,81.5" fill="#3D3D3D" />
    <polygon points="89,81.5 94,79 94,81.5 89,84" fill="#262626" />
    <!-- Steel Pole -->
    <rect x="87.5" y="54" width="3" height="25" fill="#303030" />
    <!-- Stack Housing -->
    <rect x="84.5" y="29" width="9" height="26" rx="2.5" fill="#262626" />
    <!-- Tier 3 (Bottom Standby Info / Idle) -->
    <rect x="85.8" y="47" width="6.4" height="5.5" rx="1" fill="#525C58" />
    <!-- Tier 2 (Middle Amber Standby) -->
    <rect x="85.8" y="39.5" width="6.4" height="5.5" rx="1" fill="#F5A524" opacity="0.55" />
    <!-- Tier 1 (Top Active RUN Beacon) -->
    <rect x="85.8" y="31.5" width="6.4" height="6" rx="1" fill="#5EE49B" filter="url(#oee-glow)" />
    <!-- Top Cap -->
    <ellipse cx="89" cy="29.5" rx="4.5" ry="1.6" fill="#525C58" />
    <!-- Expanding RUN Radar Ring -->
    <g transform="translate(89, 34.5)">
      <circle class="oee-radar" cx="0" cy="0" r="7.5" stroke="#38B870" stroke-width="1.4" />
    </g>
  </g>
</svg>
