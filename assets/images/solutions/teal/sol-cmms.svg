<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="cmms-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cmms-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0FAFC" />
      <stop offset="100%" stop-color="#E6F4F7" />
    </linearGradient>
    <linearGradient id="cmms-gear-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525C58" />
      <stop offset="100%" stop-color="#262626" />
    </linearGradient>
    <linearGradient id="cmms-gear-pinion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B8CA" />
      <stop offset="100%" stop-color="#0E7485" />
    </linearGradient>
    <filter id="cmms-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .cmms-gear-cw { animation: cmms-spin-cw 10s linear infinite; }
      .cmms-gear-ccw { animation: cmms-spin-ccw 6s linear infinite; }
      .cmms-row-1 { animation: cmms-check 3.6s ease-in-out 0s infinite; }
      .cmms-row-2 { animation: cmms-check 3.6s ease-in-out 1.2s infinite; }
      .cmms-row-3 { animation: cmms-check 3.6s ease-in-out 2.4s infinite; }
      @keyframes cmms-spin-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes cmms-spin-ccw {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes cmms-check {
        0%, 100% { opacity: 0.72; transform: scale(0.96); }
        25%, 50% { opacity: 1; transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#cmms-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="cmms-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#cmms-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CCE8EE" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#0E7485" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#006C7A" />
  </g>

  <!-- Interlocking Counter-Rotating Machined Gears (Exact 10:6 Pitch Ratio, D=24px at -36 deg) -->
  <g id="cmms-gears">
    <!-- Large 10-Tooth Dark Steel Gear Centered at (42, 42) -->
    <g transform="translate(42, 42)">
      <g class="cmms-gear-cw">
        <path d="M 12.60,-2.24 L 16.72,-1.69 L 16.72,1.69 L 12.60,2.24 L 11.51,5.60 L 14.51,8.46 L 12.53,11.19 L 8.88,9.22 L 6.03,11.29 L 6.77,15.38 L 3.56,16.42 L 1.76,12.68 L -1.76,12.68 L -3.56,16.42 L -6.77,15.38 L -6.03,11.29 L -8.88,9.22 L -12.53,11.19 L -14.51,8.46 L -11.51,5.60 L -12.60,2.24 L -16.72,1.69 L -16.72,-1.69 L -12.60,-2.24 L -11.51,-5.60 L -14.51,-8.46 L -12.53,-11.19 L -8.88,-9.22 L -6.03,-11.29 L -6.77,-15.38 L -3.56,-16.42 L -1.76,-12.68 L 1.76,-12.68 L 3.56,-16.42 L 6.77,-15.38 L 6.03,-11.29 L 8.88,-9.22 L 12.53,-11.19 L 14.51,-8.46 L 11.51,-5.60 Z" fill="url(#cmms-gear-main)" stroke="#262626" stroke-width="0.6" />
        <circle cx="0" cy="0" r="8.2" fill="#E4EAE7" />
        <circle cx="0" cy="0" r="5.5" fill="#0E7485" />
        <circle cx="0" cy="0" r="2.6" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Small 6-Tooth Emerald Driven Pinion Centered at (61.42, 27.89) -->
    <g transform="translate(61.42, 27.89)">
      <g class="cmms-gear-ccw">
        <path d="M -6.45,2.71 L -10.59,2.96 L -10.98,-0.69 L -6.88,-1.31 L -5.58,-4.23 L -7.86,-7.70 L -4.89,-9.85 L -2.30,-6.61 L 0.88,-6.94 L 2.74,-10.65 L 6.09,-9.16 L 4.57,-5.30 L 6.45,-2.71 L 10.59,-2.96 L 10.98,0.69 L 6.88,1.31 L 5.58,4.23 L 7.86,7.70 L 4.89,9.85 L 2.30,6.61 L -0.88,6.94 L -2.74,10.65 L -6.09,9.16 L -4.57,5.30 Z" fill="url(#cmms-gear-pinion)" stroke="#074E5A" stroke-width="0.6" />
        <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="2.2" fill="#262626" />
      </g>
    </g>
  </g>

  <!-- Crisp Machined Steel Wrench Resting on Front-Left Plinth -->
  <g id="cmms-wrench" transform="translate(39, 82) rotate(26)">
    <rect x="-11" y="-1.8" width="16" height="3.6" rx="1.2" fill="#525C58" />
    <path d="M 4,-4 A 4.2 4.2 0 1 1 4,4 L 7,2 L 7,-2 Z" fill="#CBD4D0" stroke="#3D3D3D" stroke-width="0.7" />
    <circle cx="-11" cy="0" r="3" fill="#CBD4D0" stroke="#3D3D3D" stroke-width="0.7" />
    <circle cx="-11" cy="0" r="1.2" fill="#F0FAFC" />
  </g>

  <!-- Front-Right Rugged Industrial Tablet / Paperless e-Checklist Board -->
  <g id="cmms-tablet">
    <!-- 2.5D Extruded Bezel Shadow -->
    <rect x="55" y="42" width="38" height="47" rx="4" fill="#3D3D3D" transform="translate(2.5, 2.5)" />
    <!-- Armored Tablet Shell -->
    <rect x="55" y="42" width="38" height="47" rx="4" fill="#262626" />
    <!-- Emerald Rugged Corner Accent & Top LED -->
    <path d="M 55 46 C 55 43.8 56.8 42 59 42 L 64 42 L 64 44 L 57 44 L 57 50 L 55 50 Z" fill="#00B8CA" />
    <circle cx="74" cy="44.8" r="1" fill="#4CE3F2" />
    <!-- Crisp White Digital Form Screen -->
    <rect x="58.5" y="47.5" width="31" height="38" rx="1.8" fill="#FFFFFF" />
    <!-- Header Band inside Form -->
    <rect x="58.5" y="47.5" width="31" height="5.5" rx="1.2" fill="#E6F4F7" />
    <rect x="61.5" y="49.5" width="14" height="1.6" rx="0.8" fill="#0E7485" />

    <!-- Checklist Row 1 -->
    <g transform="translate(65, 59)">
      <g class="cmms-row-1">
        <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.4" fill="#0E7485" filter="url(#cmms-glow)" />
        <polyline points="-1.8,0.2 -0.4,1.6 2,-1.4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
    <rect x="71" y="57.2" width="15" height="2.2" rx="1" fill="#262626" />
    <rect x="71" y="60.6" width="10" height="1.5" rx="0.75" fill="#A4B0AA" />

    <!-- Checklist Row 2 -->
    <g transform="translate(65, 69)">
      <g class="cmms-row-2">
        <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.4" fill="#00B8CA" filter="url(#cmms-glow)" />
        <polyline points="-1.8,0.2 -0.4,1.6 2,-1.4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
    <rect x="71" y="67.2" width="15" height="2.2" rx="1" fill="#262626" />
    <rect x="71" y="70.6" width="12" height="1.5" rx="0.75" fill="#A4B0AA" />

    <!-- Checklist Row 3 -->
    <g transform="translate(65, 79)">
      <g class="cmms-row-3">
        <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.4" fill="#00A0B0" filter="url(#cmms-glow)" />
        <polyline points="-1.8,0.2 -0.4,1.6 2,-1.4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
    <rect x="71" y="77.2" width="15" height="2.2" rx="1" fill="#262626" />
    <rect x="71" y="80.6" width="8.5" height="1.5" rx="0.75" fill="#A4B0AA" />
  </g>
</svg>
