<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="ems-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ems-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0FAFC" />
      <stop offset="100%" stop-color="#E6F4F7" />
    </linearGradient>
    <radialGradient id="ems-core-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CE3F2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0E7485" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ems-bolt-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CE3F2" />
      <stop offset="100%" stop-color="#00B8CA" />
    </linearGradient>
    <linearGradient id="ems-bolt-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7485" />
      <stop offset="100%" stop-color="#006C7A" />
    </linearGradient>
    <filter id="ems-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .ems-bolt { animation: ems-float 2.8s ease-in-out infinite; }
      .ems-ring-1 { animation: ems-ripple 2.6s ease-out 0s infinite; }
      .ems-ring-2 { animation: ems-ripple 2.6s ease-out 1.3s infinite; }
      .ems-bus { stroke-dasharray: 4 3; animation: ems-flow 1.2s linear infinite; }
      .ems-peak { animation: ems-pulse 2s ease-in-out infinite; }
      @keyframes ems-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes ems-ripple {
        0% { transform: scale(0.75); opacity: 0.78; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      @keyframes ems-flow {
        from { stroke-dashoffset: 14; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes ems-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.38); opacity: 0.55; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#ems-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="ems-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#ems-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CCE8EE" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#0E7485" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#006C7A" />
  </g>

  <!-- Incoming Isometric Power Busbars Etched on Plinth -->
  <g id="ems-busbars">
    <path d="M 33,84 L 45,78 L 53,82" stroke="#CCE8EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path class="ems-bus" d="M 33,84 L 45,78 L 53,82" stroke="#0E7485" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 60,97 L 60,91 L 56,89" stroke="#CCE8EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path class="ems-bus" d="M 60,97 L 60,91 L 56,89" stroke="#00B8CA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Upper-Right Floating Live kW Waveform Telemetry Card -->
  <g id="ems-waveform">
    <rect x="74" y="18" width="32" height="24" rx="2.5" fill="#262626" opacity="0.14" transform="translate(2, 2)" />
    <rect x="74" y="18" width="32" height="24" rx="2.5" fill="#FFFFFF" stroke="#CBD4D0" stroke-width="1" />
    <path d="M 74 20.5 C 74 19.1 75.1 18 76.5 18 L 103.5 18 C 104.9 18 106 19.1 106 20.5 L 106 23 L 74 23 Z" fill="#262626" />
    <circle cx="101.5" cy="20.5" r="1.2" fill="#4CE3F2" />
    <line x1="77" y1="33" x2="103" y2="33" stroke="#E4EAE7" stroke-width="0.9" />
    <path d="M 77,36 L 81,35 L 84,28 L 88,37 L 93,27 L 97,34 L 102,30" stroke="#0E7485" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <g transform="translate(93, 27)">
      <circle class="ems-peak" cx="0" cy="0" r="2" fill="#00B8CA" filter="url(#ems-glow)" />
    </g>
  </g>

  <!-- Central 2.5D Hexagonal Smart Power Meter Core -->
  <g id="ems-core">
    <!-- Pedestal Collar on Plinth -->
    <polygon points="46,79 56,74 66,79 56,84" fill="#525C58" />
    <polygon points="46,79 56,84 56,88 46,83" fill="#3D3D3D" />
    <polygon points="56,84 66,79 66,83 56,88" fill="#262626" />

    <!-- Concentric Expanding Energy Rings -->
    <g transform="translate(55, 51)">
      <circle cx="0" cy="0" r="25" fill="url(#ems-core-halo)" />
      <polygon class="ems-ring-1" points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" stroke="#00B8CA" stroke-width="1.4" />
      <polygon class="ems-ring-2" points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" stroke="#4CE3F2" stroke-width="1.1" />
    </g>

    <!-- 2.5D Extruded Dark Steel Hex Meter Housing -->
    <polygon points="58,28 79,40 79,64 58,76 37,64 37,40" fill="#262626" />
    <polygon points="55,27 76,39 76,63 55,75 34,63 34,39" fill="#3D3D3D" stroke="#A4B0AA" stroke-width="0.9" />
    <!-- Luminous Inner Emerald Meter Dial -->
    <polygon points="55,32 71.5,41.5 71.5,60.5 55,70 38.5,60.5 38.5,41.5" fill="#F0FAFC" stroke="#0E7485" stroke-width="1.6" />
    <polygon points="55,35 69,43 69,59 55,67 41,59 41,43" fill="#E6F4F7" />

    <!-- Hero Faceted 2.5D Lightning Bolt -->
    <g transform="translate(55, 51)">
      <g class="ems-bolt" filter="url(#ems-glow)">
        <!-- Left/Bright Facet -->
        <polygon points="2,-14 -8,1 -1,1 -3,14 8,-1 1,-1" fill="url(#ems-bolt-left)" />
        <!-- Right/Shaded Facet Split -->
        <polygon points="2,-14 -1,1 -3,14 8,-1 1,-1" fill="url(#ems-bolt-right)" />
        <!-- Crisp Specular White Leading Edge -->
        <polyline points="2,-14 -8,1 -1,1" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
