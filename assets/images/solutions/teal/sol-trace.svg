<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="trace-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="trace-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0FAFC" />
      <stop offset="100%" stop-color="#E6F4F7" />
    </linearGradient>
    <linearGradient id="trace-cone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4CE3F2" stop-opacity="0.48" />
      <stop offset="65%" stop-color="#00B8CA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0E7485" stop-opacity="0" />
    </linearGradient>
    <filter id="trace-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="trace-label-clip">
      <polygon points="44.5,63.5 57.5,70 57.5,84 44.5,77.5" />
    </clipPath>
    <style>
      .trace-laser { animation: trace-sweep 2.6s ease-in-out infinite; }
      .trace-led { animation: trace-blink 2.6s ease-in-out infinite; }
      .trace-node-1 { animation: trace-pop 2.6s ease-in-out 0s infinite; }
      .trace-node-2 { animation: trace-pop 2.6s ease-in-out 0.35s infinite; }
      .trace-node-3 { animation: trace-pop 2.6s ease-in-out 0.7s infinite; }
      .trace-link { stroke-dasharray: 3 2.5; animation: trace-flow 1.4s linear infinite; }
      @keyframes trace-sweep {
        0%, 100% { transform: translateY(-5.5px); opacity: 0.9; }
        50% { transform: translateY(6px); opacity: 1; }
      }
      @keyframes trace-blink {
        0%, 40%, 100% { opacity: 0.5; transform: scale(0.95); }
        50%, 75% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes trace-pop {
        0%, 100% { transform: scale(0.92); opacity: 0.75; }
        45%, 65% { transform: scale(1.16); opacity: 1; }
      }
      @keyframes trace-flow {
        from { stroke-dashoffset: 11; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#trace-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="trace-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#trace-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CCE8EE" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#0E7485" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#006C7A" />
  </g>

  <!-- Gantry Arm Mounting Optical Scanner Head -->
  <polygon points="29,77 32,75.5 32,27 29,28.5" fill="#525C58" />
  <polygon points="32,75.5 34.5,76.8 34.5,28.3 32,27" fill="#303030" />
  <polygon points="29,28.5 32,27 49,18.5 52,20 35,28.5" fill="#525C58" />
  <polygon points="32,29 49,20.5 49,23.5 32,32" fill="#262626" />

  <!-- Overhead Industrial Vision Scanner Head -->
  <g id="trace-scanner">
    <polygon points="44,21 55,15.5 62,19 51,24.5" fill="#525C58" />
    <polygon points="44,21 51,24.5 51,32.5 44,29" fill="#303030" />
    <polygon points="51,24.5 62,19 62,27 51,32.5" fill="#262626" />
    <!-- Optical Lens & Status LED -->
    <ellipse cx="51" cy="31" rx="3.8" ry="2.2" fill="#074E5A" />
    <ellipse cx="51" cy="31" rx="2.2" ry="1.2" fill="#4CE3F2" filter="url(#trace-glow)" />
    <g transform="translate(56.5, 24)">
      <circle class="trace-led" cx="0" cy="0" r="1.4" fill="#4CE3F2" filter="url(#trace-glow)" />
    </g>
  </g>

  <!-- Optical Laser Cone Fan -->
  <polygon points="48.5,31.5 53.5,31.5 60,72 42,63" fill="url(#trace-cone)" />

  <!-- Centered 2.5D Isometric Carton / Lot Box -->
  <g id="trace-carton">
    <!-- Top Face -->
    <polygon points="60,48 79,57.5 60,67 41,57.5" fill="#FFFFFF" />
    <polyline points="41,57.5 60,48 79,57.5" stroke="#FFFFFF" stroke-width="1" />
    <!-- Emerald GS1 Tamper Seal Strip Across Top -->
    <polygon points="57.5,49.3 62.5,49.3 68,52.1 52,60.1 47,57.6" fill="#0E7485" />
    <polygon points="52,60.1 57,62.6 73,54.6 68,52.1" fill="#00B8CA" opacity="0.85" />
    <!-- Left Face (Primary Label Face) -->
    <polygon points="41,57.5 60,67 60,90 41,80.5" fill="#E4EAE7" />
    <!-- Right Face -->
    <polygon points="60,67 79,57.5 79,80.5 60,90" fill="#CBD4D0" />
    <!-- Right Face Emerald Lot Badge -->
    <polygon points="64,69 75,63.5 75,67.5 64,73" fill="#0E7485" />
    <polygon points="64,76 72,72 72,73.8 64,77.8" fill="#76827D" />

    <!-- Crisp GS1 QR/DataMatrix Sticker on Left Face -->
    <polygon points="44,62.8 58,69.8 58,84.8 44,77.8" fill="#FFFFFF" stroke="#A4B0AA" stroke-width="0.6" />
    <!-- Vector QR / DataMatrix Finder & Modules (Exact Isometric Matrix) -->
    <g transform="matrix(1, 0.5, 0, 1, 45.6, 65.2)">
      <!-- Top-left finder -->
      <rect x="0" y="0" width="3.8" height="3.8" fill="#262626" />
      <rect x="0.9" y="0.9" width="2" height="2" fill="#FFFFFF" />
      <rect x="1.4" y="1.4" width="1" height="1" fill="#262626" />
      <!-- Top-right finder -->
      <rect x="7.0" y="0" width="3.8" height="3.8" fill="#262626" />
      <rect x="7.9" y="0.9" width="2" height="2" fill="#FFFFFF" />
      <rect x="8.4" y="1.4" width="1" height="1" fill="#262626" />
      <!-- Bottom-left finder -->
      <rect x="0" y="6.8" width="3.8" height="3.8" fill="#262626" />
      <rect x="0.9" y="7.7" width="2" height="2" fill="#FFFFFF" />
      <rect x="1.4" y="8.2" width="1" height="1" fill="#262626" />
      <!-- Data modules -->
      <rect x="4.8" y="0.4" width="1.4" height="1.4" fill="#262626" />
      <rect x="4.8" y="2.6" width="1.4" height="1.4" fill="#0E7485" />
      <rect x="0.6" y="4.8" width="1.4" height="1.4" fill="#262626" />
      <rect x="3.0" y="4.8" width="1.6" height="1.4" fill="#262626" />
      <rect x="5.6" y="4.8" width="1.4" height="1.4" fill="#262626" />
      <rect x="8.2" y="4.8" width="2.2" height="1.4" fill="#262626" />
      <rect x="4.8" y="7.2" width="1.6" height="1.4" fill="#262626" />
      <rect x="7.4" y="7.2" width="1.4" height="1.4" fill="#0E7485" />
      <rect x="9.4" y="7.2" width="1.4" height="3.4" fill="#262626" />
      <rect x="6.4" y="9.2" width="2.2" height="1.4" fill="#262626" />
      <!-- GS1 Barcode Strip Below QR -->
      <rect x="0" y="11.8" width="1.1" height="2.2" fill="#262626" />
      <rect x="1.8" y="11.8" width="1.6" height="2.2" fill="#262626" />
      <rect x="4.2" y="11.8" width="0.9" height="2.2" fill="#262626" />
      <rect x="5.8" y="11.8" width="1.8" height="2.2" fill="#262626" />
      <rect x="8.4" y="11.8" width="2.4" height="2.2" fill="#0E7485" />
    </g>

    <!-- Animated Laser Sweep Across Label -->
    <g clip-path="url(#trace-label-clip)">
      <g class="trace-laser" filter="url(#trace-glow)">
        <line x1="43" y1="69" x2="59" y2="77" stroke="#00B8CA" stroke-width="2.6" stroke-opacity="0.55" />
        <line x1="43" y1="69" x2="59" y2="77" stroke="#4CE3F2" stroke-width="1.3" />
        <line x1="43" y1="69" x2="59" y2="77" stroke="#FFFFFF" stroke-width="0.6" />
      </g>
    </g>
  </g>

  <!-- Genealogy Chain Aggregation Nodes (Unit -> Box -> Pallet) -->
  <g id="trace-genealogy">
    <path class="trace-link" d="M 80,53 L 89,40 L 98,27" stroke="#00A0B0" stroke-width="1.4" stroke-linecap="round" />
    <!-- Node 1: Unit -->
    <g transform="translate(80, 53)">
      <g class="trace-node-1">
        <polygon points="0,-5 5,-2.5 5,2.5 0,5 -5,2.5 -5,-2.5" fill="#E6F4F7" stroke="#0E7485" stroke-width="1.2" />
        <circle cx="0" cy="0" r="1.8" fill="#0E7485" />
      </g>
    </g>
    <!-- Node 2: Box -->
    <g transform="translate(89, 40)">
      <g class="trace-node-2">
        <polygon points="0,-5.5 5.5,-2.7 5.5,2.7 0,5.5 -5.5,2.7 -5.5,-2.7" fill="#CCE8EE" stroke="#0E7485" stroke-width="1.2" />
        <circle cx="0" cy="0" r="2" fill="#00B8CA" />
      </g>
    </g>
    <!-- Node 3: Pallet -->
    <g transform="translate(98, 27)">
      <g class="trace-node-3">
        <polygon points="0,-6 6,-3 6,3 0,6 -6,3 -6,-3" fill="#0E7485" stroke="#4CE3F2" stroke-width="1.1" filter="url(#trace-glow)" />
        <polyline points="-2.2,0.2 -0.6,1.8 2.6,-1.6" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
