<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="wms-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.20" />
      <stop offset="65%" stop-color="#262626" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wms-deck" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F2FAF5" />
      <stop offset="100%" stop-color="#E6F4EC" />
    </linearGradient>
    <filter id="wms-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .wms-active-box { animation: wms-glide 4s ease-in-out infinite; }
      .wms-rfid-1 { animation: wms-wave 2.2s ease-out 0s infinite; }
      .wms-rfid-2 { animation: wms-wave 2.2s ease-out 0.55s infinite; }
      .wms-bay-led-1 { animation: wms-led 2.8s ease-in-out 0s infinite; }
      .wms-bay-led-2 { animation: wms-led 2.8s ease-in-out 1.4s infinite; }
      @keyframes wms-glide {
        0%, 100% { transform: translate(0px, 0px); }
        45%, 60% { transform: translate(-8px, -10px); }
      }
      @keyframes wms-wave {
        0% { transform: scale(0.7); opacity: 0.95; }
        100% { transform: scale(1.65); opacity: 0; }
      }
      @keyframes wms-led {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Studio Ambient Shadow -->
  <ellipse cx="60" cy="99" rx="44" ry="14" fill="url(#wms-shadow)" />

  <!-- Shared 2.5D Isometric Chamfered Platform -->
  <g id="wms-plinth">
    <polygon points="24,86 56,102 56,107 24,91" fill="#CBD4D0" />
    <polygon points="56,102 64,102 64,107 56,107" fill="#A4B0AA" />
    <polygon points="64,102 96,86 96,91 64,107" fill="#76827D" />
    <polygon points="56,68 64,68 96,84 96,86 64,102 56,102 24,86 24,84" fill="url(#wms-deck)" />
    <polyline points="24,84 56,68 64,68 96,84" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
    <polygon points="57,71 63,71 90,84.5 90,85.5 63,99 57,99 30,85.5 30,84.5" fill="none" stroke="#CFEAD9" stroke-width="0.9" />
    <polygon points="64,102 96,86 96,88 64,104" fill="#008B45" />
    <polygon points="56,102 64,102 64,104 56,104" fill="#128243" />
  </g>

  <!-- 2.5D Industrial Steel Warehouse Rack (Back-Left to Back-Right Isometric Frame) -->
  <g id="wms-rack">
    <!-- Back Vertical Steel Uprights -->
    <line x1="29" y1="29" x2="29" y2="80" stroke="#525C58" stroke-width="2.4" stroke-linecap="round" />
    <line x1="59" y1="14" x2="59" y2="65" stroke="#525C58" stroke-width="2.2" stroke-linecap="round" />

    <!-- Bottom Base Shelf Deck -->
    <polygon points="29,76 59,61 72,67.5 42,82.5" fill="#CBD4D0" />
    <polygon points="29,76 42,82.5 42,84.8 29,78.3" fill="#525C58" />
    <polygon points="42,82.5 72,67.5 72,69.8 42,84.8" fill="#262626" />

    <!-- Middle Shelf Deck & Stocked Left Box -->
    <polygon points="29,56 59,41 72,47.5 42,62.5" fill="#E4EAE7" />
    <polygon points="29,56 42,62.5 42,64.8 29,58.3" fill="#525C58" />
    <polygon points="42,62.5 72,47.5 72,49.8 42,64.8" fill="#262626" />

    <!-- Lower Bay Neutral Parcel (On Bottom Shelf Left) -->
    <g id="wms-box-bot">
      <polygon points="43,66 51,62 59,66 51,70" fill="#FFFFFF" />
      <polygon points="43,66 51,70 51,79 43,75" fill="#E4EAE7" />
      <polygon points="51,70 59,66 59,75 51,79" fill="#CBD4D0" />
      <polygon points="46,70.5 49,72 49,74.5 46,73" fill="#008B45" />
    </g>

    <!-- Middle Bay Left Emerald Parcel -->
    <g id="wms-box-mid">
      <polygon points="41,45.5 49,41.5 57,45.5 49,49.5" fill="#5EE49B" />
      <polygon points="41,45.5 49,49.5 49,58.5 41,54.5" fill="#008B45" />
      <polygon points="49,49.5 57,45.5 57,54.5 49,58.5" fill="#128243" />
    </g>

    <!-- Top Shelf Deck -->
    <polygon points="29,36 59,21 72,27.5 42,42.5" fill="#F5F5F5" />
    <polygon points="29,36 42,42.5 42,44.8 29,38.3" fill="#525C58" />
    <polygon points="42,42.5 72,27.5 72,29.8 42,44.8" fill="#262626" />

    <!-- Top Bay Stocked Parcels (2 Units) -->
    <g id="wms-box-top1">
      <polygon points="41,25.5 49,21.5 57,25.5 49,29.5" fill="#FFFFFF" />
      <polygon points="41,25.5 49,29.5 49,38.5 41,34.5" fill="#E4EAE7" />
      <polygon points="49,29.5 57,25.5 57,34.5 49,38.5" fill="#CBD4D0" />
    </g>
    <g id="wms-box-top2">
      <polygon points="55,18.5 63,14.5 71,18.5 63,22.5" fill="#38B870" />
      <polygon points="55,18.5 63,22.5 63,31.5 55,27.5" fill="#008B45" />
      <polygon points="63,22.5 71,18.5 71,27.5 63,31.5" fill="#128243" />
    </g>

    <!-- Front Vertical Steel Uprights (Overlapping Shelf Corners) -->
    <line x1="42" y1="35" x2="42" y2="87" stroke="#262626" stroke-width="2.6" stroke-linecap="round" />
    <line x1="72" y1="20" x2="72" y2="72" stroke="#262626" stroke-width="2.6" stroke-linecap="round" />

    <!-- Bay Locator LEDs on Front Beam -->
    <circle class="wms-bay-led-1" cx="50" cy="61.5" r="1.4" fill="#38B870" filter="url(#wms-glow)" />
    <circle class="wms-bay-led-2" cx="65" cy="54" r="1.4" fill="#5EE49B" filter="url(#wms-glow)" />
  </g>

  <!-- Active Smart Pallet Pad in Front-Right Foreground -->
  <polygon points="62,86 76,79 88,85 74,92" fill="#E6F4EC" stroke="#008B45" stroke-width="0.9" />
  <polygon points="62,86 74,92 74,94.5 62,88.5" fill="#008B45" />
  <polygon points="74,92 88,85 88,87.5 74,94.5" fill="#128243" />

  <!-- Animated Active RFID Smart Parcel Gliding Into/Out of Bay -->
  <g class="wms-active-box">
    <!-- Smart Parcel Isometric Cube -->
    <polygon points="75,65 86,70.5 75,76 64,70.5" fill="#5EE49B" />
    <polygon points="64,70.5 75,76 75,88 64,82.5" fill="#008B45" />
    <polygon points="75,76 86,70.5 86,82.5 75,88" fill="#128243" />
    <!-- Crisp Top Specular Line & White RFID Tag Badge -->
    <polyline points="64,70.5 75,65 86,70.5" stroke="#FFFFFF" stroke-width="0.8" />
    <polygon points="67,74.5 72.5,77.2 72.5,82.2 67,79.5" fill="#FFFFFF" />
    <polygon points="68.5,76.5 71,77.8 71,80.2 68.5,78.9" fill="#262626" />

    <!-- Concentric RFID Wireless Sync Waves Above Smart Parcel -->
    <g transform="translate(81, 61)">
      <path class="wms-rfid-1" d="M -4,-3 A 6 6 0 0 1 4,-3" stroke="#38B870" stroke-width="1.5" stroke-linecap="round" />
      <path class="wms-rfid-2" d="M -6,-5 A 9 9 0 0 1 6,-5" stroke="#5EE49B" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="0" cy="-0.5" r="1.4" fill="#5EE49B" filter="url(#wms-glow)" />
    </g>
  </g>
</svg>
